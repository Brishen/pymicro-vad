---
name: wheels

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  test:
    name: "Wheels: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: venv
        run: |
          python -m venv .venv
      - name: Install uv (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install uv
      - name: Install uv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install uv
      - name: build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .venv\Scripts\uv build --wheel
      - name: build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          .venv/bin/uv build --wheel
      - name: install (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .venv\Scripts\uv pip install --no-index -f dist/ pymicro-vad
      - name: install (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          .venv/bin/uv pip install --no-index -f dist/ pymicro-vad
      - name: test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .venv\Scripts\uv pip install pytest
          .venv\Scripts\pytest -vv tests
      - name: test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          .venv/bin/uv pip install pytest
          .venv/bin/pytest -vv tests
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          overwrite: true
          include-hidden-files: false
          compression-level: 6
