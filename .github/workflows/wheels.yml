---
name: wheels

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  test:
    name: "Wheels: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: venv
        run: |
          python -m venv .venv
          .venv\Scripts\pip.exe install --upgrade pip
          .venv\Scripts\pip.exe install build
      - name: build
        run: |
          .venv\Scripts\python.exe -m build --wheel
      - name: install
        run: |
          .venv\Scripts\pip.exe install --no-index -f dist/ pymicro-vad
      - name: test
        run: |
          .venv\Scripts\pip.exe install pytest
          .venv\Scripts\pytest.exe -vv tests
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: package
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true
          include-hidden-files: false
          compression-level: 6
